<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Explorer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-mode">
    <header>
        <div class="header-container">
            <h1>Solar System Explorer</h1>
            <button id="dark-mode-toggle" class="dark-mode-toggle">🌞 Light Mode</button>
        </div>
        <p class="subtitle">Click on any planet to learn more about it</p>
    </header>

    <div class="solar-system">
        <div class="sun"></div>
        <!-- Orbits and planets will be added dynamically with JavaScript -->
    </div>

    <div class="controls">
        <button id="speed-up">Speed Up Orbits (Current: 1x)</button>
        <button id="slow-down">Slow Down Orbits</button>
        <button id="reset-speed">Reset Speed</button>
    </div>

    <!-- Modal for planet information -->
    <div class="modal" id="planet-modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="planet-info" id="planet-info">
                <!-- Content will be filled dynamically -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
